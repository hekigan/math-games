<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Les régions de France</title>
    <link rel="stylesheet" href="regions.css">
  </head>
  <body>
    <main class="shell">
      <header class="top">
        <a class="back" href="index.html">← MathiFun</a>
        <h1>Les 13 régions de France</h1>
        <div class="who-box" id="who-box" hidden>
          <span>Joueur : <strong id="who"></strong></span>
          <button type="button" id="switch" class="player">Changer de joueur</button>
        </div>
      </header>

      <section class="login" id="login" hidden>
        <form id="create-user" class="create-user">
          <label for="new-user">Créer un joueur</label>
          <div class="inline-form">
            <input id="new-user" maxlength="24" placeholder="Prénom du joueur" autocomplete="off">
            <button type="submit" class="primary">Ajouter</button>
          </div>
          <p id="login-msg" class="notice" role="status"></p>
        </form>
        <h2 id="user-title" hidden>Choisis ton profil</h2>
        <p id="no-user" class="notice" hidden>Aucun joueur pour l’instant : crée le premier !</p>
        <div id="user-list" class="user-list"></div>
      </section>

      <div id="game" hidden>
      <section class="status">
        <div class="stat"><span>Temps</span><strong id="timer">0:00</strong></div>
        <div class="stat"><span>Trouvées</span><strong id="progress">0 / 13</strong></div>
        <div class="stat"><span>Erreurs</span><strong id="errors">0</strong></div>
        <button type="button" id="start" class="primary">Commencer</button>
        <button type="button" id="giveup" class="secondary" disabled>Abandonner</button>
      </section>

      <section class="board">
        <div class="map-wrap">
          <svg id="map" viewBox="0 0 1030 1010" role="img" aria-label="Carte des régions de France métropolitaine"></svg>
          <p class="hint" id="hint">Appuie sur « Commencer ».</p>
        </div>
        <div class="choices" id="choices" aria-label="Liste des régions"></div>
      </section>

      <section class="scores">
        <h2>Meilleurs scores</h2>
        <p class="rule">Classement : plus de régions trouvées, puis temps le plus court.</p>
        <div class="score-cols" id="score-cols"></div>
      </section>
      </div>

      <div id="win" class="win" hidden>
        <div class="win-card">
          <h2 id="win-title">Bravo !</h2>
          <p id="win-text"></p>
          <p id="win-missed" class="missed-name" hidden></p>
          <button type="button" id="again" class="primary">Rejouer</button>
        </div>
      </div>
    </main>
    <script src="regions-data.js"></script>
    <script src="regions.js"></script>
  </body>
</html>
